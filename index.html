<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rent Rush // CSGO Edition</title>
  <style>
    :root{--ink:#0d1010;--cream:#f2eddd;--orange:#ff9e2c;--cyan:#74d5d7;--red:#ed4c42;--muted:#a8afa9}
    *{box-sizing:border-box} body{margin:0;min-width:320px;background:#171a18;color:var(--cream);font-family:Impact,"Arial Narrow",Arial,sans-serif;overflow:hidden}
    #game{display:block;width:100vw;height:100vh;image-rendering:pixelated;cursor:crosshair}
    .hud{position:fixed;inset:0;pointer-events:none;padding:24px 28px;text-shadow:3px 3px 0 #080909;letter-spacing:.06em}
    .top{display:flex;justify-content:space-between;align-items:flex-start}.label{font-family:Arial,sans-serif;font-weight:800;font-size:11px;color:var(--muted);letter-spacing:.16em}.money{font-size:42px;color:var(--orange);line-height:1}.round{font-size:24px;text-align:right}.deadline{font-family:Arial,sans-serif;font-size:13px;color:var(--cream);margin-top:6px}.health{position:absolute;left:28px;bottom:25px;font:700 18px Arial,sans-serif}.health b{font-size:30px;color:var(--red)}
    #overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(9,12,11,.73);backdrop-filter:blur(3px);z-index:2}.panel{width:min(560px,calc(100vw - 34px));padding:36px 38px 32px;border:4px solid var(--cream);background:#151917;box-shadow:12px 12px 0 var(--orange);text-align:center}.eyebrow{font:800 11px Arial,sans-serif;color:var(--cyan);letter-spacing:.2em}.title{margin:9px 0 8px;font-size:64px;line-height:.82;text-transform:uppercase;letter-spacing:.02em}.title span{color:var(--orange)}.subtitle{font:600 15px/1.45 Arial,sans-serif;letter-spacing:.03em;color:#d2d7d0;margin:20px auto 25px;max-width:420px}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:25px}.key{font:700 12px Arial,sans-serif;border:1px solid #737d75;padding:7px 9px;background:#252b27}.primary{border:0;background:var(--orange);padding:15px 25px;font:inherit;font-size:22px;letter-spacing:.06em;cursor:pointer;box-shadow:4px 4px 0 #9c5510}.primary:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 #9c5510}.fine{font:11px Arial,sans-serif;color:#8e9890;margin:19px 0 0;letter-spacing:.04em}.hide{display:none!important}@media(max-width:560px){.hud{padding:16px}.money{font-size:31px}.round{font-size:19px}.health{left:16px;bottom:15px}.title{font-size:51px}.panel{padding:30px 20px}.top .label{font-size:9px}}
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud">
    <div class="top"><div><div class="label">CASH FOR RENT</div><div class="money" id="cash">$0</div></div><div><div class="round" id="round">ROUND 1 / 6</div><div class="deadline" id="timer">RENT DUE: 40s</div></div></div>
    <div class="health">ARMOR <b id="armor">100</b></div>
  </div>
  <div id="overlay"><div class="panel"><div class="eyebrow">UNOFFICIAL COUNTER-STRIKE STYLE MINI GAME</div><h1 class="title">Rent <span>Rush</span></h1><p class="subtitle" id="message">The landlord doesn't take excuses. Win rounds, bag cash, and make rent before the clock hits zero.</p><div class="controls"><span class="key">WASD / ARROWS MOVE</span><span class="key">CLICK / SPACE FIRE</span></div><button class="primary" id="start">START SHIFT</button><p class="fine">NO TEAMMATES. NO BUY MENU. JUST BILLS.</p></div></div>
<script>
(()=>{const c=document.querySelector('#game'),x=c.getContext('2d'),cashEl=document.querySelector('#cash'),roundEl=document.querySelector('#round'),timerEl=document.querySelector('#timer'),armorEl=document.querySelector('#armor'),overlay=document.querySelector('#overlay'),start=document.querySelector('#start'),msg=document.querySelector('#message');let W,H,dpr,run=false,keys={},player,enemies,bullets,pickups,round,time,last,flash,win; const goal=1200, rounds=6;
function resize(){dpr=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(dpr,0,0,dpr,0,0)} addEventListener('resize',resize);resize();
function reset(){player={x:W*.5,y:H*.67,r:17,hp:100,cash:0,dir:0,shot:0};enemies=[];bullets=[];pickups=[];round=1;time=40;flash=0;win=false;spawnRound();updateHud()}
function spawnRound(){for(let i=0;i<round+2;i++){let a=Math.random()*Math.PI*2,rr=Math.min(W,H)*(.22+Math.random()*.2);enemies.push({x:W/2+Math.cos(a)*rr,y:H/2+Math.sin(a)*rr,r:16,hp:2+Math.floor(round/2),speed:.45+round*.04,hit:0})}}
function updateHud(){cashEl.textContent='$'+player.cash.toLocaleString();roundEl.textContent=`ROUND ${round} / ${rounds}`;timerEl.textContent=`RENT DUE: ${Math.max(0,Math.ceil(time))}s`;armorEl.textContent=Math.max(0,Math.ceil(player.hp))}
function fire(){if(!run||player.shot>0)return;player.shot=.18;let a=player.dir;bullets.push({x:player.x+Math.cos(a)*20,y:player.y+Math.sin(a)*20,vx:Math.cos(a)*14,vy:Math.sin(a)*14,life:42})}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function tick(dt){
  if(!run)return;
  time-=dt;
  if(time<=0){end(false,'RENT OVERDUE. The landlord changed the locks.');return}
  let dx=(keys.a||keys.arrowleft?-1:0)+(keys.d||keys.arrowright?1:0), dy=(keys.w||keys.arrowup?-1:0)+(keys.s||keys.arrowdown?1:0);
  if(dx||dy){let l=Math.hypot(dx,dy);player.x=Math.max(25,Math.min(W-25,player.x+dx/l*240*dt));player.y=Math.max(100,Math.min(H-25,player.y+dy/l*240*dt))}
  player.shot-=dt;
  for(let b of bullets){
    b.x+=b.vx;b.y+=b.vy;b.life--;
    for(let e of enemies){
      if(!e.dead&&dist(b,e)<e.r+5){e.hp--;e.hit=.14;b.life=0;if(e.hp<=0){e.dead=true;pickups.push({x:e.x,y:e.y,r:13,v:100+round*25})}}
    }
  }
  bullets=bullets.filter(b=>b.life>0&&b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);
  for(let e of enemies){
    if(e.dead)continue;
    let a=Math.atan2(player.y-e.y,player.x-e.x);e.x+=Math.cos(a)*e.speed*60*dt;e.y+=Math.sin(a)*e.speed*60*dt;
    if(dist(e,player)<e.r+player.r){player.hp-=13*dt;flash=.12}
  }
  for(let p of pickups)if(dist(p,player)<35){player.cash+=p.v;p.got=true}
  pickups=pickups.filter(p=>!p.got);enemies=enemies.filter(e=>!e.dead);
  if(player.hp<=0){end(false,"YOU GOT ECO'D. Rent remains unpaid.");return}
  if(!enemies.length){if(round===rounds||player.cash>=goal){end(true,`RENT PAID: $${player.cash.toLocaleString()}. You live to queue another day.`);return}round++;time+=8;spawnRound()}
  updateHud();flash=Math.max(0,flash-dt)
}
function draw(){x.fillStyle='#1c211e';x.fillRect(0,0,W,H);x.strokeStyle='#343d36';x.lineWidth=2;for(let i=-H;i<W+H;i+=55){x.beginPath();x.moveTo(i,0);x.lineTo(i-H,H);x.stroke()}x.fillStyle='#101412';x.fillRect(0,86,W,4);x.fillStyle='#252d28';x.fillRect(0,90,W,H-90);for(let p of pickups){x.save();x.translate(p.x,p.y);x.rotate(.25);x.fillStyle='#ff9e2c';x.fillRect(-12,-9,24,18);x.fillStyle='#31210d';x.font='bold 11px Arial';x.fillText('$',-4,4);x.restore()}for(let e of enemies){x.save();x.translate(e.x,e.y);x.fillStyle=e.hit>0?'#fff0c9':'#ed4c42';x.fillRect(-e.r,-e.r,e.r*2,e.r*2);x.fillStyle='#411611';x.fillRect(-7,-4,4,4);x.fillRect(4,-4,4,4);x.fillStyle='#070908';x.fillRect(-10,21,20,4);x.fillStyle='#f2eddd';x.fillRect(-10,21,20*(e.hp/(2+Math.floor(round/2))),4);x.restore()}for(let b of bullets){x.fillStyle='#f7e94e';x.beginPath();x.arc(b.x,b.y,4,0,7);x.fill()}x.save();x.translate(player.x,player.y);x.rotate(player.dir);x.fillStyle='#74d5d7';x.fillRect(-17,-17,34,34);x.fillStyle='#101514';x.fillRect(7,-5,25,10);x.fillStyle='#e5e0d0';x.fillRect(-9,-6,4,4);x.fillRect(4,-6,4,4);x.restore();x.strokeStyle='#f2eddd';x.lineWidth=1;x.beginPath();x.moveTo(W/2-10,H/2);x.lineTo(W/2+10,H/2);x.moveTo(W/2,H/2-10);x.lineTo(W/2,H/2+10);x.stroke();if(flash){x.fillStyle=`rgba(237,76,66,${flash*2})`;x.fillRect(0,0,W,H)} }
function frame(now){let dt=Math.min(.05,(now-last)/1000||0);last=now;tick(dt);draw();requestAnimationFrame(frame)}
function end(ok,text){run=false;win=ok;msg.textContent=text;start.textContent=ok?'RUN IT BACK':'TRY AGAIN';overlay.classList.remove('hide')}
start.onclick=()=>{overlay.classList.add('hide');reset();run=true;last=performance.now()};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.preventDefault();fire()}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);c.addEventListener('mousemove',e=>player&&(player.dir=Math.atan2(e.clientY-player.y,e.clientX-player.x)));c.addEventListener('mousedown',fire);requestAnimationFrame(frame)})();
</script>
</body></html>
